<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creaciones Madriz | Inventarios</title>
    <link rel="stylesheet" href="../../css/inventario.css">
    <link rel="stylesheet" href="../../modulos/modales.css">

    
</head>


<body>

    <!-- Modal para el botón: añadir inventario-->
    <div class="modal" id="modal-inv-categorias"> 
    <div class="modal-inv-content">
        <div class="modal-inv-header">
            <h3 class="modal-inv-title">Selecciona una categoría</h3>
            </div>

        <div class="modal-inv-body" id="modal-inv-body">
            <nav>
                <button class="btn-inv-categoria" id="agregar-vestido">Vestidos</button>
                <button class="btn-inv-categoria" id="agregar-producto">Productos</button>
                <button class="btn-inv-categoria" id="agregar-tela">Telas</button>
                <button class="btn-inv-categoria" id="agregar-insumo">Insumos</button>
            </nav>
        </div>

        <div class="modal-inv-footer">
            
            <button id="btn-inv-cerrar-modal">Cerrar</button>
            <button id="btn-inv-atras" style="display: none;">← Atrás</button>
            </div>

    </div>

    </div>

    <!-- Modal Editar Item -->
    <div id="modal-editar" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="titulo-editar">Editar Item</h2>
                <button id="cerrar-editar" class="btn-cerrar">&times;</button>
            </div>
            <div class="modal-body" id="cuerpo-editar">
                <!-- Aquí se cargará el formulario dinámicamente -->
            </div>
            <div class="modal-footer">
                <button id="cancelar-editar" class="btn-secundario">Cancelar</button>
                <button id="guardar-editar" class="btn-primario">Guardar Cambios</button>
            </div>
        </div>
    </div>
    
    <header class="topbar">
        
        <div class="logo">
            <a href="../../screens/dashboard.html">
                <img src="../../../assets/img/logo.png" alt="Logo">
            </a>
        </div>
        
        <!-- Informacion del usuario y fecha actual -->
        <div class="info-usuario">
        <h2>¡Revisa tus inventarios!</h2>
        <!-- Traemos la fecha y hora actual-->
        <p id="currentDate"></p>
        </div>
        
        <!-- Menu de navegacion -->
        <nav class="nav-menu">
            <!-- Lista de enlaces de navegacion -->
            <ul>
                <li>
                    <!-- Botón para ir al punto de venta de la app -->
                    <a href="../../screens/venta/pos.html">
                        <img src="../../../assets/img/icon_pos.png">
                        <span style="font-family: Comfortaa;">Punto de Venta</span>    
                    </a>
                </li>
        
            </ul>
        </nav>

    </header>

    <main class="main-content">
        
        <div class="inventory-intro">
        <p style="font-family: Comfortaa;">Aquí podrás gestionar tus inventarios.</p>
        <button class="añadir" id="btn-añadir-inv">Añadir a inventario</button>
        
        </div>

        <!-- Aqui dividiremos la parte de los botones y el inventario en si -->
        
        <div class="inventario-layout">
            <div class="contenedor-botones">
                <nav>
                    <button class="botones" id="btn-vestidos">Vestidos</button>
                    <button class="botones" id="btn-productos">Productos</button>
                    <button class="botones" id="btn-telas">Telas</button>
                    <button class="botones" id="btn-insumos">Insumos</button>
                </nav>
            </div>

            <!-- Contenedor donde se muestran los inventarios actuales -->
            <div class="inventarios" id="contenedor-inventario">

                <div class="inventario-vacio">
                    <p style="font-family: Comfortaa;">Seleccione una categoría para ver el inventario</p>
                </div>

            </div>

        </div>
        </div>
    </main>

    <!-- Scripts -->
    <script type="module"  src="../../js/inventario.js"></script>
    <!--<script src="../../js/database.js"></script>-->
    <script type="module"  src="../../templates/formulariosAdd.js"></script>
    <script type="module" src="../../modulos/renderer_inventario.js"></script>
</body>

</html>
