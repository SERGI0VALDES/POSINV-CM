<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Punto de venta de la aplicación para Creaciones Madriz-->
    <title>Creaciones Madriz | Punto de Venta</title>
    <link rel="stylesheet" href="../../css/globals.css">
    <link rel="stylesheet" href="../../css/pos.css">

</head>

<body>
    <header class="topbar">

        <!-- Logo de la empresa -->
        <div class="logo">
            <a data-screen="DASHBOARD">
                <img src="../../../assets/img/logo.png" alt="logo">
            </a>
        </div>

        <!-- Informacion del usuario y fecha actual -->
        <div class="info-usuario">
            <h2>¡Bienvenido al punto de venta!
            </h2>
            <!-- Traemos la fecha y hora actual-->
            <p id="currentDate"></p>
        </div>

        <!-- Menu de navegacion -->
        <nav class="nav-menu">
            <ul>
                <li>
                    <!-- Botón para ver los inventarios -->
                    <a href="../inventarios/inventario.html">
                        <img src="../../../assets/img/img_inventario.png">
                        <span style="font-family: Comfortaa;">Revisar inventarios</span>
                    </a>
                </li>
            </ul>
        </nav>

    </header>

    <main class="main-content">

        <!-- En esta caja se encuentra el lado izquierdo de la pantalla; contiene el buscador de productos, el h3="Products" y donde 
         se refleja la busqueda de los productos. -->
        <div class="cajaIzq">
            <input id="buscador" type="text" placeholder="Buscar producto...">
            <p>Productos</p>
            <!-- Asegúrate que este ID coincida con el JS -->
            <div class="listaProductos" id="listaProductos">
                <!-- Se llenará dinámicamente -->
            </div>
        </div>

        <!-- En esta caja se encuentra el lado derecho de la pantalla; contiene el carrito de compras y el total a pagar. -->
        <div class="cajaDer">
            <!--Carrito de compras o pedido actual-->
            <div class="carrito-contenedor">

                <!-- Titulo de el apartado -->
                <span> Pedido Actual </span>

                <!-- lista de compras -->
                <ul id="listaCarrito" class="ulInterno">
                    <!-- Los elementos del carrito se generan dinámicamente con JavaScript -->
                </ul>

            </div>

            <!--Contenedor del sumario final del carrito de compras-->
            <div class="total-contenedor">
                <span>Sumario de venta</span>

                <span id="subtotalTexto">Subtotal: $0.00</span>

                <span id="descuento">
                </span>

                <span id="totalPrecio" class="total-precio">$0.00</span>

                <span id="totalTexto" style="display:none;"></span>

                <div class="funciones-compra">
                    <button class="btn btn-primary finalizar-compra-btn" id="finalizarCompraBtn">Finalizar</button>
                    <button class="btn btn-secondary agregar-descuento-btn">Descuento</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Scripts -->
    <script type="module" src="../../js/cargar_rutas.js"></script>
    <script src="../../js/modules/pos/pos.js"></script>

</body>

</html>
